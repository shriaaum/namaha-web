services:
  backend:
    image: namaha-web
    container_name: namaha-web
    restart: always
    ports:
      - "3001:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    env_file:
      - .env
